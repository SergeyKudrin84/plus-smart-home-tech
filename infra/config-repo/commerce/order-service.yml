spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/order_db
    username: dbuser
    password: 12345
  cloud:
    openfeign:
      client:
        config:
          default: # применяется по умолчанию для всех клиентов
            connectTimeout: 2000
            readTimeout: 3000
          inventory-service: # название сервиса в @FeignClient
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: basic

logging:
  level:
    ru.yandex.practicum.order.feign.InventoryClient: DEBUG

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: none
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
    open-in-view: false

server:
  port: 0