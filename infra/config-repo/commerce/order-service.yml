spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/order_db
    username: dbuser
    password: 12345
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default: # применяется по умолчанию для всех клиентов
            connectTimeout: 2000
            readTimeout: 3000
          inventory-service: # название сервиса в @FeignClient
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: basic

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: none
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
    open-in-view: false

server:
  port: 0

logging:
  level:
    ru.yandex.practicum.order.feign.InventoryClient: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 3s